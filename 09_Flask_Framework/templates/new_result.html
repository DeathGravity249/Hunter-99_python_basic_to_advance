<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Result</title>
</head>
<body>
    <h1>Based on the marks, you have {{ results }}</h1>

    {% if results >= 50 %}
        <h2>You have passed with {{ results }} marks</h2>
    {% else %}
        <h2>You have failed with {{ results }} marks</h2>
    {% endif %}
</body>
</html>
